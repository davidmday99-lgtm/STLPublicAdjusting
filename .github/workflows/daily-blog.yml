name: Daily blog publish

on:
  schedule:
    # 7:00 AM America/Chicago is 13:00 UTC during CST and 12:00 UTC during CDT.
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish next draft (if any)
        run: node scripts/publish-next.mjs

      - name: Render posts
        run: node scripts/render-post.mjs

      # blog.html is now a hand-curated responsive index. Rebuilding it with the
      # legacy generator would overwrite the approved design and featured guides.
      - name: Build sitemap
        run: node scripts/build-sitemap.mjs

      - name: Commit & push (if changes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Publish daily blog post"
          git push
