name: Daily blog publish

on:
  schedule:
    # 7:00 AM America/Chicago is 13:00 UTC during CST (winter) and 12:00 UTC during CDT (summer).
    # We'll run at 13:00 UTC. If you want exact local-time alignment year-round, we can adjust to a dual schedule.
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish next draft (if any)
        run: node scripts/publish-next.mjs

      - name: Render posts
        run: node scripts/render-post.mjs

      - name: Build blog index
        run: node scripts/build-blog.mjs

      - name: Build sitemap
        run: node scripts/build-sitemap.mjs

      - name: Commit & push (if changes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Publish daily blog post"
          git push
