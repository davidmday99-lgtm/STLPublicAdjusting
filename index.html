<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>STL Public Adjusting | Coming Soon</title>
  <meta name="description" content="STL Public Adjusting — St. Louis public adjuster. Site under maintenance. Coming soon with full services." />
  <style>
    :root{
      --bg:#071018;
      --panel:#0b1723;
      --text:#f3f6fb;
      --muted:#c2cbd8;
      --accent:#c8102e;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:2rem;
    }
    .logo{
      font-size:clamp(1.6rem,4vw,2.4rem);
      font-weight:800;
      letter-spacing:.04em;
      margin-bottom:.5rem;
    }
    .logo span{color:var(--accent)}
    .divider{
      width:80px;
      height:3px;
      background:var(--accent);
      margin:1.2rem auto;
      border-radius:2px;
    }
    h1{
      font-size:clamp(1.4rem,3.5vw,2rem);
      font-weight:700;
      margin-bottom:1rem;
    }
    p{
      color:var(--muted);
      font-size:1.05rem;
      max-width:500px;
      line-height:1.6;
      margin-bottom:2rem;
    }
    .badge{
      display:inline-block;
      padding:.5rem 1.4rem;
      border:1px solid var(--accent);
      border-radius:6px;
      color:var(--accent);
      font-weight:600;
      font-size:.95rem;
      letter-spacing:.03em;
    }
    .contact{
      margin-top:2.5rem;
      color:var(--muted);
      font-size:.9rem;
    }
    .contact a{
      color:var(--text);
      text-decoration:none;
      border-bottom:1px solid rgba(255,255,255,.25);
    }
    .contact a:hover{border-color:var(--accent);color:var(--accent)}
  </style>
</head>
<body>
  <div class="logo">STL <span>Public Adjusting</span></div>
  <div class="divider"></div>
  <h1>We'll Be Right Back</h1>
  <p>Our site is currently undergoing maintenance. We'll be back soon with full public adjusting services for the St. Louis area.</p>
  <div class="badge">🚧 Coming Soon</div>
  <div class="contact">
    <p>Need to reach us now?<br>
    <a href="mailto:info@stlpublicadjusting.com">info@stlpublicadjusting.com</a></p>
  </div>
</body>
</html>
