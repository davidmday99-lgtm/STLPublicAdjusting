<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redirecting…</title>
  <meta http-equiv="refresh" content="0; url=/contact.html#form" />
  <link rel="canonical" href="/contact.html#form" />
  <script>
    // Fallback for clients that ignore meta refresh
    window.location.replace('/contact.html#form');
  </script>
</head>
<body>
  <p>If you are not redirected, <a href="/contact.html#form">click here</a>.</p>
</body>
</html>
