  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>README | STL Public Adjusting</title>
  <meta name="description" content="README" />
  <style>
    :root{
      --bg:#071018;
      --text:#f3f6fb;
      --muted:#c2cbd8;
      --line:rgba(255,255,255,.10);
      --red:#C41E3A;
      --navy:#0C2340;
      --radius:18px;
      --max:900px;
      --pad:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1100px 700px at 15% 0%, rgba(196,30,58,.18) 0%, rgba(7,16,24,0) 55%),
        radial-gradient(900px 600px at 85% 10%, rgba(12,35,64,.35) 0%, rgba(7,16,24,0) 55%),
        linear-gradient(180deg, #061019 0%, var(--bg) 100%);
      line-height: 1.65;
    }
    a{color:inherit}
    .topbar{
      position:fixed; top:0; left:0; right:0; z-index:9999;
      backdrop-filter: blur(10px);
      background: rgba(7,16,24,.72);
      border-bottom:1px solid var(--line);
    }
    .wrap{max-width:var(--max); margin:0 auto; padding:0 18px}
    .nav{display:flex; align-items:center; justify-content:space-between; padding:14px 0; gap:12px;}
    .links{display:flex; gap:12px; flex-wrap:wrap;}
    .links a{color:var(--muted); text-decoration:none}
    .links a:hover{color:var(--text)}
    main{padding:26px 0 50px}
    .card{
      background: rgba(11,23,35,.82);
      border:1px solid rgba(255,255,255,.10);
      border-radius: var(--radius);
      box-shadow: 0 0 0 3px rgba(255,255,255,.25), 0 8px 28px rgba(0,0,0,.6);
      padding: var(--pad);
    }
    h1{line-height:1.15}
    h2{margin-top:22px}
    ul{margin:10px 0 10px 20px}
    .meta{color:var(--muted); font-size:13px; margin-top:4px}
  </style>
</head>
<body>
  <header class="topbar">
<!-- GA4 loaded in <head> -->
    <div class="wrap">
      <div class="nav">
        <div style="font-weight:900;">STL Public Adjusting</div>
        <nav class="links">
          <a href="/">Home</a>
          <a href="/blog.html">Blog</a>
          <a href="/contact-form.html#form">Get Help Now</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="card">
        <h1>Blog posts</h1>
<ul>
<li>Drafts live in `drafts/`.</li>
<li>Published posts live in `posts/`.</li>
<li>`blog.html` is the index that should list published posts.</li>
</ul>
        
      </div>
    </div>
  </main>

  <script>
    (function(){
      const topbar = document.querySelector('.topbar');
      function applyPad(){
        if(!topbar) return;
        document.body.style.paddingTop = topbar.offsetHeight + 'px';
      }
      window.addEventListener('load', applyPad);
      window.addEventListener('resize', applyPad);
      applyPad();
    })();
  </script>
</body>
</html>
